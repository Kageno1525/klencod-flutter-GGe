name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: 'Flutter version (must be a real release — e.g. 3.27.1)'
        required: true
        default: '3.27.1'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # ✅ v4 (v5 مش موجود)
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ v4 (v5 مش موجود)
      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ✅ v4 (v5 مش موجود)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          cache: true
          channel: stable

      # ✅ لضمان بيئة نظيفة
      - name: Flutter clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      # ✅ تفعيل tree-shaking للـ icons لتقليل حجم APK
      - name: Build APK
        run: flutter build apk --release

      # ✅ v4 — متوافق
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7